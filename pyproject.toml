[project]
name = "evapcond"
requires-python = ">=3.10,<3.13"
dynamic = ["version"]
dependencies = [
    "CoolProp==6.6.0",
    "PySide6==6.6.2",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "pytest==8.3.4",
    "pyinstaller==6.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
